<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album - Spotify Clone</title>
  <link href="./dist/output.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black font-inter">
  <div class="grid grid-cols-1 grid-rows-10 max-h-screen gap-2">
    <!-- Sidebar -->
    <div class="w-full h-full col-span-1 row-span-9 px-4 pt-3">
      <div class="container-fluid h-full grid grid-cols-8 flex-grow">
        <div class="sm:col-span-3 lg:col-span-3 xl:col-span-2 flex items-start justify-start flex-col text-white pt-1 pr-4 overflow-y-scroll">
          <div class="w-full bg-secondary pt-4 px-5 pb-8 rounded-base">
            <span class="flex items-center justify-start gap-1 mb-5">
              <img src="./assets/imgs/brand/Logo.svg" alt="logo" width="22" />
              <span class="text-md font-bold font-inter">Spotify</span>
            </span>
            <ul class="flex items-start justify-start flex-col gap-5">
              <li>
                <a class="flex items-center justify-start gap-2 text-sm hover:text-green-500" href="main.html">
                  <img src="./assets/imgs/svgs/home.svg" alt="home" width="15" />
                  <span class="ml-1">Home</span>
                </a>
              </li>
              <li>
                <a class="flex items-center justify-start gap-2 text-sm hover:text-green-500" href="#">
                  <img src="./assets/imgs/svgs/search.svg" alt="search" width="15" />
                  <span class="ml-1">Search</span>
                </a>
              </li>
            </ul>
          </div>
          <!-- Library -->
          <div class="w-full h-max bg-secondary pt-5 px-3 pb-8 rounded-base mt-4">
            <span class="w-full flex items-center justify-between flex-row-reverse gap-2 px-4 mb-5">
              <span class="text-sm">Your Library</span>
            </span>
            <!-- Playlists/Podcasts boutons -->
            <div class="bg-[#1F1F1F] w-full h-max rounded-[15px] pt-5 pb-10 px-6">
              <h3 class="text-[21px] font-semibold">Create your first playlist</h3>
              <p class="text-sm mt-1 mb-5">It's easy, we'll help you</p>
              <button class="bg-white rounded-full text-black font-semibold text-sm px-5 py-2">Create playlist</button>
            </div>
            <div class="bg-[#1F1F1F] w-full h-max rounded-[15px] pt-5 pb-10 px-6 mt-4">
              <h3 class="text-[17px] font-semibold">Let’s find some podcasts to follow</h3>
              <p class="text-sm mt-1 mb-5">We’ll keep you updated on new episodes</p>
              <button class="bg-white rounded-full text-black font-semibold text-sm px-5 py-2">Browse podcasts</button>
            </div>
          </div>
          <div></div>
        </div>
        <!-- Main Content -->
        <div class="card-scroll-container sm:col-span-5 lg:col-span-5 xl:col-span-6 bg-custom-gradient w-full mt-1 rounded-2xl overflow-x-hidden pb-20">
          <!-- Header Album -->
          <div class="flex flex-col md:flex-row items-center gap-6 p-6 md:p-10">
            <img id="albumCover" src="" alt="Cover album" class="w-32 h-32 rounded-lg shadow bg-[#222] object-cover" />
            <div class="flex flex-col items-center md:items-start">
              <h1 id="albumTitle" class="text-2xl font-bold text-white mb-1 truncate">Album</h1>
              <p id="albumArtist" class="text-lg text-gray-300 mb-2 truncate">Artiste</p>
              <span id="albumYear" class="text-sm text-gray-400">Année</span>
            </div>
          </div>
          <!-- Liste des titres -->
          <div class="bg-[#181818] rounded-xl shadow p-4 mx-2 md:mx-8">
            <h2 class="text-lg text-white font-semibold mb-4">Titres</h2>
            <ul id="trackList" class="divide-y divide-[#282828]">
              <!-- Titres générés dynamiquement -->
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- Bottom Player Bar -->
    <div class="w-full bg-[#181818] border-t border-[#282828] fixed bottom-0 left-0 z-50">
      <div class="player-container w-full max-w-7xl mx-auto px-2 sm:px-4 md:px-6 py-2 sm:py-3 flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-0">
        <div class="w-full flex flex-row items-center justify-center sm:justify-start sm:w-1/3 min-w-0 mb-1 sm:mb-0">
          <img id="currentArtwork" src="placeholder.jpg" alt="Album artwork" class="w-9 h-9 sm:w-14 sm:h-14 rounded-md shadow mr-2 sm:mr-4 object-cover bg-[#222] flex-shrink-0" />
          <div class="flex flex-col overflow-hidden min-w-0 flex-1">
            <h2 id="currentTitle" class="text-white text-xs sm:text-base font-semibold truncate">Aucune piste</h2>
            <p id="currentArtist" class="text-gray-400 text-[11px] sm:text-xs truncate">-</p>
          </div>
          <div class="flex flex-row items-center gap-2 sm:hidden ml-2">
            <button id="prev" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#282828] text-white hover:text-green-500 transition text-lg" aria-label="Piste précédente">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button id="playPause" class="w-9 h-9 flex items-center justify-center rounded-full bg-white text-black hover:scale-105 shadow-lg transition text-lg font-bold" aria-label="Lecture/Pause">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            <button id="next" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#282828] text-white hover:text-green-500 transition text-lg" aria-label="Piste suivante">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>
        </div>
        <div class="controls hidden sm:flex flex-col items-center w-1/3">
          <div class="flex items-center gap-4 mb-1">
            <button id="prev" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#282828] text-white hover:text-green-500 transition text-2xl" aria-label="Piste précédente">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button id="playPause" class="w-11 h-11 flex items-center justify-center rounded-full bg-white text-black hover:scale-105 shadow-lg transition text-2xl font-bold" aria-label="Lecture/Pause">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            <button id="next" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#282828] text-white hover:text-green-500 transition text-2xl" aria-label="Piste suivante">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>
          <div class="flex items-center gap-2 w-full min-w-0">
            <span id="time" class="text-xs text-gray-400 min-w-[70px]">0:00 / 0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100" class="w-full h-1 accent-green-500 bg-gray-700 rounded-lg appearance-none focus:outline-none" />
          </div>
        </div>
        <div id="trackList" style="display: none" class="hidden sm:block w-1/3"></div>
        <div class="flex flex-row items-center gap-2 w-full min-w-0 mt-1 sm:hidden">
          <span id="time" class="text-xs text-gray-400 min-w-[55px]">0:00 / 0:00</span>
          <input type="range" id="progress" value="0" min="0" max="100" class="w-full h-1 accent-green-500 bg-gray-700 rounded-lg appearance-none focus:outline-none" />
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./assets/js/album.js"></script>
</body>
</html>
